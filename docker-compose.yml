version: "3.9"

# MoodLift Backend - Integration Mode (Local Docker Compose)
# This configuration is for LOCAL DEVELOPMENT and CI/CD testing ONLY
# 
# Production deployment: Use docker run on EC2 instances with .env.production
#
# Usage:
#   docker compose up --build
#   docker compose down
#
# Environment: Copy .env.local.example to .env before running

services:
  # MongoDB Container (Development Only)
  mongo:
    image: mongo:7-alpine
    container_name: moodlift-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: moodlift
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moodlift-network

  # User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: moodlift-user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/moodlift
      MONGODB_DB: moodlift
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - moodlift-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Session Service
  session-service:
    build:
      context: ./session-service
      dockerfile: Dockerfile
    container_name: moodlift-session-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      MONGODB_URI: mongodb://mongo:27017/moodlift
      MONGODB_DB: moodlift
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - moodlift-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Chat Service
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: moodlift-chat-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      MONGODB_URI: mongodb://mongo:27017/moodlift
      MONGODB_DB: moodlift
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - moodlift-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Payment Service
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: moodlift-payment-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      MONGODB_URI: mongodb://mongo:27017/moodlift
      MONGODB_DB: moodlift
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - moodlift-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3004/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: moodlift-ai-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      MONGODB_URI: mongodb://mongo:27017/moodlift
      MONGODB_DB: moodlift
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - moodlift-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3005/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Feedback Service
  feedback-service:
    build:
      context: ./feedback-service
      dockerfile: Dockerfile
    container_name: moodlift-feedback-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      MONGODB_URI: mongodb://mongo:27017/moodlift
      MONGODB_DB: moodlift
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - moodlift-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3006/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: moodlift-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # All services communicate via Docker container names
      USER_SERVICE_URL: http://user-service:3001
      SESSION_SERVICE_URL: http://session-service:3002
      CHAT_SERVICE_URL: http://chat-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      AI_SERVICE_URL: http://ai-service:3005
      FEEDBACK_SERVICE_URL: http://feedback-service:3006
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3000}
    depends_on:
      - user-service
      - session-service
      - chat-service
      - payment-service
      - ai-service
      - feedback-service
    networks:
      - moodlift-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo-data:
    driver: local

networks:
  moodlift-network:
    driver: bridge
